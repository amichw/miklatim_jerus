<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>סקירת קואורדינטות – מקלטים</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font-size: 0.9rem; }
    #layout { display: flex; height: 100vh; }

    /* ── Left panel ── */
    #panel {
      width: 320px; min-width: 320px;
      display: flex; flex-direction: column;
      border-left: 1px solid #dee2e6;
      background: #f8f9fa;
    }
    #panel-header {
      background: #1a5276; color: #fff;
      padding: 10px 14px; font-weight: 700; font-size: 1rem;
      flex-shrink: 0;
    }
    #filter-bar {
      padding: 8px 10px; border-bottom: 1px solid #dee2e6;
      background: #fff; flex-shrink: 0;
    }
    #filter-bar label { font-size: 0.8rem; }
    #shelter-list {
      flex: 1; overflow-y: auto; list-style: none;
      margin: 0; padding: 0;
    }
    #shelter-list li {
      padding: 7px 10px; cursor: pointer;
      border-bottom: 1px solid #eee;
      display: flex; align-items: center; gap: 6px;
    }
    #shelter-list li:hover { background: #e8f4fd; }
    #shelter-list li.active { background: #d0e8f7; font-weight: 700; }
    .row-badge {
      width: 14px; height: 14px; border-radius: 50%;
      flex-shrink: 0; border: 2px solid rgba(0,0,0,0.2);
    }
    .row-diff { color: #888; font-size: 0.78rem; margin-right: auto; white-space: nowrap; }

    /* ── Info panel ── */
    #info-panel {
      background: #fff; border-top: 1px solid #dee2e6;
      padding: 10px; flex-shrink: 0;
    }
    #info-panel .address { font-weight: 600; margin-bottom: 4px; }
    #info-panel .meta { font-size: 0.8rem; color: #555; margin-bottom: 8px; }
    #action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    #action-btns button { flex: 1; font-size: 0.82rem; }

    /* ── Map ── */
    #map { flex: 1; min-width: 0; }
    .leaflet-container { direction: ltr; }

    /* ── Stat bar ── */
    #stat-bar {
      padding: 4px 10px; font-size: 0.78rem; color: #555;
      background: #fff; border-bottom: 1px solid #dee2e6;
      flex-shrink: 0;
    }

    /* ── Pulsing orange marker ── */
    .orig-pulse {
      width: 18px; height: 18px;
      background: #e67e22;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(230,126,34,0.6);
      animation: opulse 1.6s ease-out infinite;
    }
    @keyframes opulse {
      0%   { box-shadow: 0 0 0 0   rgba(230,126,34,0.6); }
      70%  { box-shadow: 0 0 0 12px rgba(230,126,34,0);  }
      100% { box-shadow: 0 0 0 0   rgba(230,126,34,0);   }
    }
  </style>
</head>
<body>
<div id="layout">
  <!-- Left panel -->
  <div id="panel">
    <div id="panel-header">🔍 סקירת קואורדינטות</div>

    <div id="stat-bar">טוען…</div>

    <div id="filter-bar">
      <div class="mb-1">
        <label>מינימום הפרש:
          <strong id="diff-val">10</strong> מ'
        </label>
        <input type="range" id="diff-slider" class="form-range form-range-sm"
               min="10" max="200" step="5" value="10" />
      </div>
      <div>
        <label>הצג:</label>
        <select id="show-filter" class="form-select form-select-sm mt-1">
          <option value="all">הכל</option>
          <option value="unreviewed">לא נסקר בלבד</option>
          <option value="reviewed">נסקר בלבד</option>
        </select>
      </div>
    </div>

    <ul id="shelter-list"></ul>

    <!-- Info + action panel -->
    <div id="info-panel">
      <div class="address" id="info-address">בחר מקלט מהרשימה</div>
      <div class="meta" id="info-meta"></div>
      <div id="action-btns">
        <button class="btn btn-sm btn-warning" id="btn-orig" disabled
                title="O">
          🟠 מקורי
        </button>
        <button class="btn btn-sm btn-primary" id="btn-geo" disabled
                title="G">
          🔵 גאוקוד
        </button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-skip" disabled
                title="→ / N">
          דלג ←
        </button>
      </div>
      <div style="font-size:0.72rem;color:#999;margin-top:6px">
        מקשים: O=מקורי, G=גאוקוד, N/→=הבא, P/←=הקודם
      </div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>
</div>

<script>
// ── Map ───────────────────────────────────────────────────────
const map = L.map('map').setView([31.78, 35.21], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────
let allShelters = [];
let filtered = [];
let currentIdx = -1;
let origMarker = null, geoMarker = null;

// ── Haversine ─────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── Load data ─────────────────────────────────────────────────
async function loadData() {
  const res = await fetch('/data/shelters.json');
  allShelters = await res.json();
  // Attach diff to each shelter
  for (const s of allShelters) {
    if (s.geo_lat != null && s.geo_lon != null && s.lat != null && s.lon != null) {
      s._diff = haversine(s.lat, s.lon, s.geo_lat, s.geo_lon);
    } else {
      s._diff = 0;
    }
  }
  applyFilters();
}

// ── Filter & render list ───────────────────────────────────────
function getMinDiff() { return parseInt(document.getElementById('diff-slider').value, 10); }
function getShowFilter() { return document.getElementById('show-filter').value; }

function applyFilters() {
  const minDiff = getMinDiff();
  const show = getShowFilter();

  filtered = allShelters
    .filter(s => s._diff >= minDiff)
    .filter(s => {
      if (show === 'unreviewed') return s.use_geo == null;
      if (show === 'reviewed')   return s.use_geo != null;
      return true;
    })
    .sort((a, b) => b._diff - a._diff);

  renderList();
  updateStatBar();

  // If current selection still in filtered, re-select it; else clear
  if (currentIdx >= 0) {
    const cur = filtered[currentIdx];
    if (!cur) { currentIdx = filtered.length - 1; }
    if (currentIdx >= 0) selectItem(currentIdx, false);
  }
}

function rowColor(s) {
  if (s.use_geo == null) return '#aaa';
  return s.use_geo ? '#2980b9' : '#e67e22';
}

function renderList() {
  const ul = document.getElementById('shelter-list');
  ul.innerHTML = '';
  for (let i = 0; i < filtered.length; i++) {
    const s = filtered[i];
    const li = document.createElement('li');
    li.dataset.idx = i;
    if (i === currentIdx) li.classList.add('active');

    const dot = document.createElement('span');
    dot.className = 'row-badge';
    dot.style.background = rowColor(s);

    const label = document.createElement('span');
    label.textContent = `${s.shelter_number || '?'} – ${s.address || ''}`;
    label.style.overflow = 'hidden';
    label.style.textOverflow = 'ellipsis';
    label.style.whiteSpace = 'nowrap';

    const diff = document.createElement('span');
    diff.className = 'row-diff';
    diff.textContent = `${Math.round(s._diff)} מ'`;

    li.appendChild(dot);
    li.appendChild(label);
    li.appendChild(diff);
    li.addEventListener('click', () => selectItem(i));
    ul.appendChild(li);
  }
}

function updateStatBar() {
  const reviewed = filtered.filter(s => s.use_geo != null).length;
  document.getElementById('stat-bar').textContent =
    `נסקר: ${reviewed} / ${filtered.length} (סה"כ בסף: ${filtered.length})`;
}

// ── Select shelter ─────────────────────────────────────────────
const origIcon = L.divIcon({
  className: '',
  html: '<div class="orig-pulse"></div>',
  iconSize: [18, 18],
  iconAnchor: [9, 9],
});

function selectItem(idx, flyTo = true) {
  currentIdx = idx;
  renderList();  // refresh highlight

  const s = filtered[idx];
  if (!s) return;

  // Scroll list row into view
  const li = document.querySelector(`#shelter-list li[data-idx="${idx}"]`);
  if (li) li.scrollIntoView({ block: 'nearest' });

  // Info panel
  document.getElementById('info-address').textContent =
    s.address || s.map_address || s.shelter_number || '—';

  const statusLabel = s.use_geo == null ? '⬜ לא נסקר'
                    : s.use_geo         ? '🔵 גאוקוד'
                                        : '🟠 מקורי';
  const sourceLabel = s.geo_source ? ` (${s.geo_source})` : '';
  document.getElementById('info-meta').innerHTML =
    `הפרש: <strong>${Math.round(s._diff)} מ'</strong> | מקור גאוקוד: ${s.geo_source || '—'}<br>` +
    `מקורי: ${s.lat?.toFixed(6)}, ${s.lon?.toFixed(6)}<br>` +
    `גאוקוד: ${s.geo_lat?.toFixed(6)}, ${s.geo_lon?.toFixed(6)}<br>` +
    `סטטוס: ${statusLabel}`;

  document.getElementById('btn-orig').disabled = false;
  document.getElementById('btn-geo').disabled  = false;
  document.getElementById('btn-skip').disabled = false;

  // Map markers
  if (origMarker) { map.removeLayer(origMarker); origMarker = null; }
  if (geoMarker)  { map.removeLayer(geoMarker);  geoMarker  = null; }

  if (s.lat != null && s.lon != null) {
    origMarker = L.marker([s.lat, s.lon], { icon: origIcon, zIndexOffset: 500 })
      .addTo(map)
      .bindPopup(`<b>מקורי</b><br>${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}`);
  }

  if (s.geo_lat != null && s.geo_lon != null) {
    geoMarker = L.circleMarker([s.geo_lat, s.geo_lon], {
      radius: 10, fillColor: '#2980b9', color: '#fff', weight: 2,
      opacity: 1, fillOpacity: 0.9,
    }).addTo(map)
      .bindPopup(`<b>גאוקוד</b> (${s.geo_source || '?'})<br>${s.geo_lat.toFixed(6)}, ${s.geo_lon.toFixed(6)}`);
  }

  if (flyTo && s.lat != null && s.geo_lat != null) {
    const bounds = L.latLngBounds([[s.lat, s.lon], [s.geo_lat, s.geo_lon]]);
    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 18 });
  }
}

// ── Set decision ───────────────────────────────────────────────
async function setDecision(useGeo) {
  const s = filtered[currentIdx];
  if (!s) return;

  const res = await fetch('/api/set-coords', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ shelter_number: s.shelter_number, use_geo: useGeo }),
  });
  const data = await res.json();
  if (!data.ok) { alert('שגיאה בשמירה'); return; }

  // Update local cache
  s.use_geo = useGeo;
  // Also update in allShelters
  const orig = allShelters.find(x => x.shelter_number === s.shelter_number);
  if (orig) orig.use_geo = useGeo;

  updateStatBar();
  advanceNext();
}

function advanceNext() {
  // Reapply filters (might remove current if filter is "unreviewed")
  const prevShelterNumber = filtered[currentIdx]?.shelter_number;
  applyFilters();

  // Try to stay on same item or advance
  const newIdx = filtered.findIndex(s => s.shelter_number === prevShelterNumber);
  if (newIdx >= 0) {
    // Item still visible — move to next unreviewed after it
    const nextUnreviewed = filtered.findIndex((s, i) => i > newIdx && s.use_geo == null);
    if (nextUnreviewed >= 0) { selectItem(nextUnreviewed); return; }
  }
  // Fallback: advance by 1
  const next = Math.min(currentIdx, filtered.length - 1);
  if (next >= 0) selectItem(next);
}

// ── Buttons ───────────────────────────────────────────────────
document.getElementById('btn-orig').addEventListener('click', () => setDecision(false));
document.getElementById('btn-geo').addEventListener('click',  () => setDecision(true));
document.getElementById('btn-skip').addEventListener('click', () => {
  if (currentIdx < filtered.length - 1) selectItem(currentIdx + 1);
});

// ── Filters ───────────────────────────────────────────────────
document.getElementById('diff-slider').addEventListener('input', function() {
  document.getElementById('diff-val').textContent = this.value;
  applyFilters();
});
document.getElementById('show-filter').addEventListener('change', applyFilters);

// ── Keyboard ──────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case 'ArrowRight': case 'n': case 'N':
      e.preventDefault();
      if (currentIdx < filtered.length - 1) selectItem(currentIdx + 1);
      break;
    case 'ArrowLeft': case 'p': case 'P':
      e.preventDefault();
      if (currentIdx > 0) selectItem(currentIdx - 1);
      break;
    case 'o': case 'O':
      e.preventDefault();
      setDecision(false);
      break;
    case 'g': case 'G':
      e.preventDefault();
      setDecision(true);
      break;
  }
});

// ── Boot ──────────────────────────────────────────────────────
loadData().then(() => {
  if (filtered.length > 0) selectItem(0);
});
</script>
</body>
</html>
