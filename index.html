<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מקלטים – ירושלים</title>

  <!-- Bootstrap 5 RTL -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        crossorigin="anonymous" />

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          crossorigin=""></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    #wrapper { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 300px;
      min-width: 300px;
      background: #fff;
      overflow-y: auto;
      border-left: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: width 0.2s, min-width 0.2s;
    }
    #sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; }

    #sidebar-header {
      background: #1a5276;
      color: #fff;
      padding: 12px 14px;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    #sidebar-body { padding: 12px; flex: 1; }

    /* ── Map ── */
    #map { flex: 1; min-width: 0; }

    /* Force Leaflet to always use LTR coordinates,
       even when Bootstrap RTL sets dir=rtl on body. */
    .leaflet-container { direction: ltr; }

    /* ── Toggle button ── */
    #toggle-btn {
      position: absolute;
      top: 10px;
      right: 310px;
      z-index: 1100;
      background: #1a5276;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: right 0.2s;
    }
    #toggle-btn.collapsed { right: 10px; }

    /* ── Legend ── */
    .legend {
      background: rgba(255,255,255,0.92);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.82rem;
      line-height: 1.6;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      text-align: right;
    }
    .legend-dot {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-left: 5px;
      vertical-align: middle;
    }

    /* ── Popup ── */
    .shelter-popup { min-width: 220px; max-width: 280px; direction: rtl; text-align: right; }
    .shelter-popup h6 { margin-bottom: 6px; color: #1a5276; font-weight: 700; }
    .shelter-popup .field { margin-bottom: 3px; font-size: 0.85rem; }
    .shelter-popup .field-label { font-weight: 600; color: #444; }

    /* ── Search dropdown ── */
    .search-dropdown {
      list-style: none;
      margin: 2px 0 0;
      padding: 0;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 4px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 1001;
      font-size: 0.82rem;
    }
    .search-dropdown li {
      padding: 6px 10px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      line-height: 1.3;
    }
    .search-dropdown li:last-child { border-bottom: none; }
    .search-dropdown li:hover { background: #e8f4fd; }

    /* ── Filter section ── */
    .filter-section { margin-bottom: 14px; }
    .filter-section label { font-size: 0.85rem; }
    .filter-title { font-weight: 700; font-size: 0.9rem; color: #1a5276; margin-bottom: 6px; }

    /* Prevent Bootstrap hover-fill from lingering after deselect */
    #type-filters .btn:not(.active) {
      --bs-btn-hover-bg: transparent;
      --bs-btn-hover-color: var(--bs-btn-color);
      --bs-btn-hover-border-color: var(--bs-btn-border-color);
    }

    /* ── Stats badge ── */
    #stats { font-size: 0.8rem; color: #555; margin-bottom: 10px; }

    /* ── Locate control button ── */
    .leaflet-control-locate a {
      display: flex !important;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      width: 42px !important;
      height: 42px !important;
      cursor: pointer;
      text-decoration: none;
      background: #2980b9 !important;
      color: #fff !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .leaflet-control-locate.locating a { background: #1a6a9f !important; animation: spin 1s linear infinite; }
    .leaflet-control-locate.located  a { background: #27ae60 !important; color: #fff !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Push both Leaflet corners above phone gesture/navigation bar */
    @media (max-width: 767px) {
      .leaflet-bottom.leaflet-left,
      .leaflet-bottom.leaflet-right { bottom: 60px; }
    }

    /* ── Location error toast ── */
    #loc-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44,62,80,0.9);
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
      direction: rtl;
    }
    #loc-toast.show { opacity: 1; }

    /* ── Pulsing user-location dot ── */
    .user-dot {
      width: 16px; height: 16px;
      background: #2980b9;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(41,128,185,0.5);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(41,128,185,0.5); }
      70%  { box-shadow: 0 0 0 14px rgba(41,128,185,0);   }
      100% { box-shadow: 0 0 0 0   rgba(41,128,185,0);   }
    }

  @media (max-width: 767px) {
    .leaflet-control-attribution .attr-break { display: block; }
  }

  /* ── Street-pin marker ── */
  .street-pin { font-size: 1.5rem; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  </style>
</head>
<body>

<button id="toggle-btn" title="הצג/הסתר תפריט">☰</button>

<div id="wrapper">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">🏠 מקלטים – ירושלים</div>
    <div id="sidebar-body">

      <div id="stats">טוען נתונים…</div>

      <!-- Street search -->
      <div class="filter-section">
        <div class="filter-title">חיפוש רחוב</div>
        <div class="input-group input-group-sm">
          <input id="search-input" type="text" class="form-control"
                 placeholder="חפש רחוב בירושלים..." autocomplete="off" />
          <button class="btn btn-outline-secondary" id="search-btn" type="button" title="חיפוש">🔍</button>
        </div>
        <ul id="search-dropdown" class="search-dropdown"></ul>
      </div>

      <!-- Type toggles -->
      <div class="filter-section">
        <div class="filter-title">סוג מקלט</div>
        <div id="type-filters" class="d-flex flex-wrap gap-1">
          <button class="btn btn-sm btn-outline-success active" data-type="standard">ציבורי</button>
          <button class="btn btn-sm btn-outline-secondary active" data-type="school">בית ספר</button>
          <button class="btn btn-sm btn-outline-primary active" data-type="accessible">נגיש</button>
          <button class="btn btn-sm btn-outline-danger active" data-type="protected">מחסה</button>
        </div>
      </div>

      <!-- Neighborhood filter -->
      <div class="filter-section">
        <div class="filter-title">שכונות</div>
        <div class="mb-1">
          <button class="btn btn-xs btn-link p-0 text-decoration-none" id="select-all-nb" style="font-size:0.8rem">בחר הכל</button>
          &nbsp;|&nbsp;
          <button class="btn btn-xs btn-link p-0 text-decoration-none" id="clear-all-nb" style="font-size:0.8rem">נקה הכל</button>
        </div>
        <div id="neighborhood-filters" style="max-height:300px;overflow-y:auto;font-size:0.82rem;"></div>
      </div>

    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>
</div>
<div id="loc-toast"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

<script>
// ── Map init ──────────────────────────────────────────────────
const map = L.map('map').setView([31.78, 35.21], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | <span class="attr-break"></span>Created by: <a href="https://github.com/amichw/miklatim_jerus" target="_blank">Ami</a> | <a href="mailto:amiweil2@gmail.com">amiweil2@gmail.com</a>',
  maxZoom: 19,
}).addTo(map);

// ── Legend ────────────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <strong>סוגי מקלטים</strong><br>
    מחסה <span class="legend-dot" style="background:#c0392b"></span><br>
    מקלט נגיש <span class="legend-dot" style="background:#2980b9"></span><br>
    מקלט ציבורי <span class="legend-dot" style="background:#27ae60"></span><br>
    בית ספר <span class="legend-dot" style="background:#7f8c8d"></span>
  `;
  return div;
};
legend.addTo(map);

// ── Locate control ────────────────────────────────────────────
let locateContainer;

const LocateControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd() {
    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-locate');
    locateContainer = container;
    const btn = L.DomUtil.create('a', '', container);
    btn.title = 'מיקום נוכחי';
    btn.setAttribute('role', 'button');
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
  <circle cx="12" cy="12" r="3"/>
  <line x1="12" y1="2" x2="12" y2="7"/>
  <line x1="12" y1="17" x2="12" y2="22"/>
  <line x1="2" y1="12" x2="7" y2="12"/>
  <line x1="17" y1="12" x2="22" y2="12"/>
</svg>`;
    L.DomEvent.on(btn, 'click', L.DomEvent.stopPropagation)
              .on(btn, 'click', L.DomEvent.preventDefault)
              .on(btn, 'click', () => locate(container, true));
    return container;
  },
});
new LocateControl().addTo(map);

let locationLayers = null;   // accuracy circle + position dot
let nearestLine = null;      // dashed line to nearest shelter
let userLocation = null;     // last known GPS position

// Auto-trigger geolocation on page load (silent – no error toast)
locate(locateContainer, false);

// ── Haversine distance (metres) ───────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function findNearest(latlng) {
  let nearest = null, minDist = Infinity;
  for (const s of allShelters) {
    const d = haversine(latlng.lat, latlng.lng, s.lat, s.lon);
    if (d < minDist) { minDist = d; nearest = s; }
  }
  return { shelter: nearest, dist: minDist };
}

function distLabel(m) {
  return m < 1000 ? `${Math.round(m)} מ'` : `${(m / 1000).toFixed(1)} ק"מ`;
}

function showNearestAt(lat, lon, fromLabel = 'מיקומך') {
  if (!allShelters.length) return;
  const latlng = L.latLng(lat, lon);
  const { shelter, dist } = findNearest(latlng);
  if (!shelter) return;

  // Remove old line
  if (nearestLine) { map.removeLayer(nearestLine); nearestLine = null; }

  // Dashed line from origin to nearest shelter
  nearestLine = L.polyline([latlng, [shelter.lat, shelter.lon]], {
    color: '#e74c3c', weight: 2, dashArray: '6 6', opacity: 0.8,
  }).addTo(map);

  // Fit both points in view with padding
  map.fitBounds(L.latLngBounds([latlng, [shelter.lat, shelter.lon]]), {
    padding: [60, 60],
  });

  // Build popup content with distance row prepended
  let html = `<div class="shelter-popup">`;
  html += `<h6 style="color:#e74c3c">מקלט קרוב ל${fromLabel}</h6>`;
  html += `<div class="field" style="font-weight:700">מרחק: ${distLabel(dist)}</div>`;
  for (const [key, label] of Object.entries(FIELD_LABELS)) {
    const val = shelter[key];
    if (val && String(val).trim()) {
      html += `<div class="field"><span class="field-label">${label}:</span> ${val}</div>`;
    }
  }
  html += mapsLink(shelter.lat, shelter.lon, shelter.map_address || shelter.address);
  html += `</div>`;

  L.popup({ maxWidth: 300 })
    .setLatLng([shelter.lat, shelter.lon])
    .setContent(html)
    .openOn(map);
}

let _locToastTimer = null;
function showLocToast(msg) {
  const t = document.getElementById('loc-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_locToastTimer);
  _locToastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

function locate(container, userInitiated = false) {
  // If we already have a stored location, center on it immediately
  if (userLocation) {
    map.setView(userLocation, Math.max(map.getZoom(), 16));
  }

  container.classList.add('locating');
  map.locate({ enableHighAccuracy: true });

  map.once('locationfound', (e) => {
    container.classList.remove('locating');
    container.classList.add('located');

    const isNew = !userLocation ||
      haversine(userLocation.lat, userLocation.lng, e.latlng.lat, e.latlng.lng) > 15;

    // Always refresh dot + accuracy circle
    if (locationLayers) locationLayers.forEach(l => map.removeLayer(l));

    const accCircle = L.circle(e.latlng, {
      radius: e.accuracy,
      color: '#2980b9', weight: 1,
      fillColor: '#2980b9', fillOpacity: 0.1,
      interactive: false,
    }).addTo(map);

    const dot = L.marker(e.latlng, {
      icon: L.divIcon({
        className: '',
        html: '<div class="user-dot"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      }),
      zIndexOffset: 1000,
    }).addTo(map);

    dot.on('click', () => showNearestAt(e.latlng.lat, e.latlng.lng));
    locationLayers = [accCircle, dot];
    userLocation = e.latlng;

    // Always re-center on new GPS result
    map.setView(e.latlng, Math.max(map.getZoom(), 16));

    // Only pop nearest and recompute distances if location changed
    if (isNew) {
      applyFilters();
      showNearestAt(e.latlng.lat, e.latlng.lng);
    }
  });

  map.once('locationerror', () => {
    container.classList.remove('locating');
    if (userInitiated) {
      showLocToast('לא ניתן לאתר מיקום – אנא אפשר גישה למיקום');
    }
  });
}

// ── Zoom-dependent marker radius ──────────────────────────────
function zoomRadius() {
  const z = map.getZoom();
  if (z <= 12) return 5;
  if (z <= 13) return 7;
  if (z <= 14) return 9;
  if (z <= 15) return 12;
  if (z <= 16) return 15;
  return 18;
}

map.on('zoomend', () => {
  const r = zoomRadius();
  layerGroup.eachLayer(layer => { if (layer.setRadius) layer.setRadius(r); });
});

// ── Color coding ──────────────────────────────────────────────
function shelterType(s) {
  const cat = (s.category || '').toLowerCase();
  const type = (s.type || '').toLowerCase();
  const acc  = (s.accessibility || '').toLowerCase();
  if (type.includes('מחסה') || cat.includes('מחסה')) return 'protected';
  if (acc.includes('נגיש') || cat.includes('נגיש') || type.includes('נגיש')) return 'accessible';
  if (cat.includes('בית ספר') || cat.includes('בית-ספר')) return 'school';
  return 'standard';
}

const TYPE_COLOR = {
  protected:  '#c0392b',
  accessible: '#2980b9',
  standard:   '#27ae60',
  school:     '#7f8c8d',
};

// ── Popup builder ─────────────────────────────────────────────
const FIELD_LABELS = {
  neighborhood:   'שכונה',
  shelter_number: 'מספר מקלט',
  address:        'כתובת',
  area:           'שטח (מ"ר)',
  type:           'סוג',
  accessibility:  'נגישות',
  capacity:       'מס\' נפשות',
  affiliation:    'שייכות',
  map_address:    'כתובת למפה',
  admin:          'מינהל',
  district:       'שכונה (מינהל)',
  category:       'קטגוריה',
};

function mapsLink(lat, lon, address) {
  const dest = address ? encodeURIComponent(address) : `${lat},${lon}`;
  const url = `https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking`;
  return `<div style="margin-top:8px;text-align:center">
    <a href="${url}" target="_blank" rel="noopener"
       style="display:inline-block;padding:6px 16px;background:#1a5276;color:#fff;
              border-radius:4px;text-decoration:none;font-size:0.85rem">
      🗺 נווט למקלט
    </a></div>`;
}

function buildPopup(s) {
  let html = `<div class="shelter-popup">`;
  html += `<h6>${s.shelter_number || 'מקלט'}</h6>`;
  if (userLocation) {
    const d = haversine(userLocation.lat, userLocation.lng, s.lat, s.lon);
    html += `<div class="field" style="font-weight:700;color:#555">📍 מרחק: ${distLabel(d)}</div>`;
  }
  for (const [key, label] of Object.entries(FIELD_LABELS)) {
    const val = s[key];
    if (val && String(val).trim()) {
      html += `<div class="field"><span class="field-label">${label}:</span> ${val}</div>`;
    }
  }
  html += mapsLink(s.lat, s.lon, s.map_address || s.address);
  html += `</div>`;
  return html;
}

// ── Data & markers ────────────────────────────────────────────
let allShelters = [];
const layerGroup = L.layerGroup().addTo(map);

async function loadShelters() {
  try {
    const res = await fetch('data/shelters.json');
    if (!res.ok) throw new Error(`HTTP error: ${res.status} ${res.statusText}`);
    allShelters = await res.json();
    buildNeighborhoodFilters();
    applyFilters();
  } catch (err) {
    document.getElementById('stats').textContent = `שגיאה בטעינת הנתונים: ${err.message}`;
    console.error('loadShelters failed:', err);
  }
}

function buildNeighborhoodFilters() {
  const neighborhoods = [...new Set(
    allShelters.map(s => s.neighborhood || '').filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, 'he'));

  const container = document.getElementById('neighborhood-filters');
  container.innerHTML = '';
  for (const nb of neighborhoods) {
    const id = `nb-${nb}`;
    const div = document.createElement('div');
    div.className = 'form-check';
    div.innerHTML = `
      <input class="form-check-input nb-check" type="checkbox" id="${id}"
             value="${nb}" checked />
      <label class="form-check-label" for="${id}">${nb}</label>
    `;
    container.appendChild(div);
  }
  container.querySelectorAll('.nb-check').forEach(cb =>
    cb.addEventListener('change', applyFilters)
  );
}

// ── Active type set ───────────────────────────────────────────
const activeTypes = new Set(['standard', 'school', 'accessible', 'protected']);

document.getElementById('type-filters').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.type;
    if (activeTypes.has(t)) { activeTypes.delete(t); btn.classList.remove('active'); }
    else                     { activeTypes.add(t);    btn.classList.add('active'); }
    applyFilters();
  });
});

// ── Select/clear all neighborhoods ───────────────────────────
document.getElementById('select-all-nb').addEventListener('click', () => {
  document.querySelectorAll('.nb-check').forEach(cb => { cb.checked = true; });
  applyFilters();
});
document.getElementById('clear-all-nb').addEventListener('click', () => {
  document.querySelectorAll('.nb-check').forEach(cb => { cb.checked = false; });
  applyFilters();
});

// ── Filter logic ──────────────────────────────────────────────
function applyFilters() {
  const checkedNB = new Set(
    [...document.querySelectorAll('.nb-check:checked')].map(cb => cb.value)
  );

  layerGroup.clearLayers();
  let visible = 0;

  for (const s of allShelters) {
    const type = shelterType(s);

    // Type filter
    if (!activeTypes.has(type)) continue;

    // Neighborhood filter (shelters with no neighborhood always pass)
    const nb = s.neighborhood || '';
    if (nb && checkedNB.size > 0 && !checkedNB.has(nb)) continue;

    const color = TYPE_COLOR[type];
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: zoomRadius(),
      fillColor: color,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.85,
    });
    marker.bindPopup(buildPopup(s), { maxWidth: 300 });
    marker._shelterId = s.shelter_number;
    layerGroup.addLayer(marker);
    visible++;
  }

  document.getElementById('stats').textContent =
    `מציג ${visible} מתוך ${allShelters.length} מקלטים`;
}

// ── Street geocoder ───────────────────────────────────────────
let streetPin = null;
let streetPinTimer = null;
let streetSearchController = null;

function clearStreetPin() {
  if (streetPin) { map.removeLayer(streetPin); streetPin = null; }
  if (streetPinTimer) { clearTimeout(streetPinTimer); streetPinTimer = null; }
}

function hideGeoDropdown() {
  const dd = document.getElementById('search-dropdown');
  dd.style.display = 'none';
  dd.innerHTML = '';
}

function showGeoDropdown(results) {
  const dd = document.getElementById('search-dropdown');
  dd.innerHTML = '';
  for (const r of results) {
    const li = document.createElement('li');
    li.textContent = r.display_name.split(',').slice(0, 3).join(', ');
    li.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectGeoResult(r);
    });
    dd.appendChild(li);
  }
  dd.style.display = 'block';
}

function selectGeoResult(result) {
  hideGeoDropdown();
  document.getElementById('search-input').value =
    result.display_name.split(',').slice(0, 2).join(', ');
  const lat = parseFloat(result.lat);
  const lon = parseFloat(result.lon);

  // Place / refresh street pin
  clearStreetPin();
  streetPin = L.marker([lat, lon], {
    icon: L.divIcon({
      className: '',
      html: '<div class="street-pin">📍</div>',
      iconSize: [24, 24],
      iconAnchor: [12, 24],
    }),
    zIndexOffset: 500,
  }).addTo(map);
  streetPinTimer = setTimeout(clearStreetPin, 30000);

  showNearestAt(lat, lon, 'הרחוב שבחרת');
}

function setSearchSpinner(show) {
  document.getElementById('search-btn').innerHTML = show
    ? '<span class="spinner-border spinner-border-sm" role="status"></span>'
    : '🔍';
}

async function searchStreet() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) return;

  // Cancel any in-flight request
  if (streetSearchController) streetSearchController.abort();
  streetSearchController = new AbortController();

  setSearchSpinner(true);
  hideGeoDropdown();

  try {
    const url = 'https://nominatim.openstreetmap.org/search?'
      + new URLSearchParams({
          q: query + ', ירושלים',
          format: 'json',
          limit: '5',
          countrycodes: 'il',
          viewbox: '35.15,31.85,35.32,31.70',
          bounded: '1',
        });
    const res = await fetch(url, { signal: streetSearchController.signal });
    const results = await res.json();

    if (!results.length) {
      showLocToast('רחוב לא נמצא');
      return;
    }
    if (results.length === 1) {
      selectGeoResult(results[0]);
    } else {
      showGeoDropdown(results);
    }
  } catch (err) {
    if (err.name !== 'AbortError') showLocToast('שגיאה בחיפוש');
  } finally {
    setSearchSpinner(false);
  }
}

const searchInput = document.getElementById('search-input');
document.getElementById('search-btn').addEventListener('click', searchStreet);
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); searchStreet(); }
  if (e.key === 'Escape') hideGeoDropdown();
});
searchInput.addEventListener('blur', () => setTimeout(hideGeoDropdown, 150));

// ── Right-click / long-press → find nearest shelter ───────────
function openLongPressPopup(latlng) {
  const html = `<div style="text-align:right;direction:rtl">
    <b>מצא מקלט קרוב</b><br>
    <button class="btn btn-sm btn-danger mt-1"
            onclick="findNearestFromPopup(${latlng.lat},${latlng.lng})">
      מצא מקלט קרוב כאן
    </button>
  </div>`;
  L.popup({ maxWidth: 230 })
    .setLatLng(latlng)
    .setContent(html)
    .openOn(map);
}

function findNearestFromPopup(lat, lon) {
  map.closePopup();
  showNearestAt(lat, lon, 'הנקודה שבחרת');
}

// Desktop right-click
map.on('contextmenu', (e) => {
  L.DomEvent.preventDefault(e.originalEvent);
  openLongPressPopup(e.latlng);
});

// Mobile long-press (600 ms, cancel on move > 10 px)
let _touchTimer = null;
let _touchStartPos = null;
let _longPressLatLng = null;

map.on('touchstart', (e) => {
  if (e.originalEvent.touches.length !== 1) return;
  const t = e.originalEvent.touches[0];
  _touchStartPos = { x: t.clientX, y: t.clientY };
  _longPressLatLng = e.latlng;
  _touchTimer = setTimeout(() => {
    openLongPressPopup(_longPressLatLng);
    _touchTimer = null;
  }, 600);
});

map.on('touchmove', (e) => {
  if (!_touchTimer || !_touchStartPos) return;
  const t = e.originalEvent.touches[0];
  const dx = t.clientX - _touchStartPos.x;
  const dy = t.clientY - _touchStartPos.y;
  if (dx * dx + dy * dy > 100) { clearTimeout(_touchTimer); _touchTimer = null; }
});

map.on('touchend', () => { clearTimeout(_touchTimer); _touchTimer = null; });

// ── Sidebar toggle ────────────────────────────────────────────
const sidebar   = document.getElementById('sidebar');
const toggleBtn = document.getElementById('toggle-btn');

toggleBtn.addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
  toggleBtn.classList.toggle('collapsed');
  setTimeout(() => map.invalidateSize(), 210);
});

// ── Mobile: start with sidebar closed ────────────────────────
if (window.innerWidth < 768) {
  toggleBtn.click();   // reuses transition + invalidateSize timing
}

// ── Mobile: collapse sidebar on map tap ──────────────────────
map.on('click', () => {
  if (window.innerWidth < 768 && !sidebar.classList.contains('collapsed')) {
    toggleBtn.click();
  }
});

// ── Boot ──────────────────────────────────────────────────────
loadShelters();
</script>
</body>
</html>
